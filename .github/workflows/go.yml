name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # Test the Go internals on all 3 OSes (no GUI, no frontend build needed)
  # The frontend/dist/.gitkeep placeholder satisfies the //go:embed directive.
  # -------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Generate env_defaults.go from secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # Fall back to placeholders if secrets are not set (PRs from forks).
          GID="${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID}"
          GSEC="${GOOGLE_CLIENT_SECRET:-YOUR_GOOGLE_CLIENT_SECRET}"
          UURL="${UPSTASH_REDIS_URL:-YOUR_UPSTASH_REDIS_URL}"
          FPID="${FIREBASE_PROJECT_ID:-httptoolkitpro}"
          {
            echo "package config"
            echo ""
            echo "const ("
            echo "    defaultGoogleClientID     = \"$GID\""
            echo "    defaultGoogleClientSecret = \"$GSEC\""
            echo "    defaultUpstashRedisURL    = \"$UURL\""
            echo "    defaultFirebaseProjectID  = \"$FPID\""
            echo ")"
          } > internal/config/env_defaults.go

      - name: Test
        run: go test -v ./...

      - name: Build (verify compilation)
        run: go build -v .

  # -------------------------------------------------------------------
  # Build the unified Wails v3 desktop app for all 3 platforms
  # -------------------------------------------------------------------
  build-desktop:
    name: Desktop App (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate env_defaults.go from secrets
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          GID="${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID}"
          GSEC="${GOOGLE_CLIENT_SECRET:-YOUR_GOOGLE_CLIENT_SECRET}"
          UURL="${UPSTASH_REDIS_URL:-YOUR_UPSTASH_REDIS_URL}"
          FPID="${FIREBASE_PROJECT_ID:-httptoolkitpro}"
          {
            echo "package config"
            echo ""
            echo "const ("
            echo "    defaultGoogleClientID     = \"$GID\""
            echo "    defaultGoogleClientSecret = \"$GSEC\""
            echo "    defaultUpstashRedisURL    = \"$UURL\""
            echo "    defaultFirebaseProjectID  = \"$FPID\""
            echo ")"
          } > internal/config/env_defaults.go

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Generate Wails bindings
        run: wails3 generate bindings

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build desktop app
        run: wails3 build

      - name: Package desktop app
        run: wails3 package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HttpToolkit-Pro-${{ matrix.platform }}
          path: bin/
          if-no-files-found: warn
